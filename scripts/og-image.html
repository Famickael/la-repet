<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Image d'aperçu La Répét'</title>
<!-- Source de public/og-image.png (1200 x 630), régénérée par `node scripts/og-image.mjs`.
     Couleurs : dégradé de marque GRAD (primary #386097, blueDk #2E7CB0, violet #5C4BB9, src/tokens.js), texte et logo
     en blanc (contraste 4,5:1 au moins sur le milieu du dégradé, docs/design-system.md, 1.3). Polices : Outfit 800
     (titres, police du logo) et Inter 600, servies par public/fonts. Logo : masques de public/img/logo. -->
<style>
  @font-face{font-family:'Outfit';font-weight:800;src:url('../public/fonts/outfit-latin-800-normal.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:600;src:url('../public/fonts/inter-latin-600-normal.woff2') format('woff2')}
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:84px 96px;
    background:linear-gradient(135deg,#386097 0%,#2E7CB0 50%,#5C4BB9 100%);color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .logo{display:flex;align-items:center;gap:30px;position:relative}
  .layer{position:absolute;inset:0;background:#fff;-webkit-mask-size:100% 100%;-webkit-mask-repeat:no-repeat}
  .mark{position:relative;height:150px;aspect-ratio:200/171}
  .word{position:relative;height:142px;aspect-ratio:380/189}
  .bulles{-webkit-mask-image:url('../public/img/logo/bulles.png')}
  .points{-webkit-mask-image:url('../public/img/logo/points.png')}
  .lettres{-webkit-mask-image:url('../public/img/logo/lettres.png')}
  .accents{-webkit-mask-image:url('../public/img/logo/accents.png')}
  h1{position:relative;margin:0;font:800 66px/1.08 'Outfit',sans-serif;letter-spacing:-.025em;max-width:960px}
  p{position:relative;margin:22px 0 0;font:600 32px/1.3 'Inter',sans-serif;opacity:.95}
</style>
</head>
<body>
  <div class="card">
        <div class="logo" role="img" aria-label="La Répét'">
      <div class="mark"><span class="layer bulles"></span><span class="layer points"></span></div>
      <div class="word"><span class="layer lettres"></span><span class="layer accents"></span></div>
    </div>
    <div>
      <h1>Entraînez-vous pour<br />votre entretien,<br />avec votre coach.</h1>
      <p>À voix haute, sans avatar. Un retour qui décrit, sans noter.</p>
    </div>
  </div>
<script>
  /* Même dégradé que ci-dessus, calculé pixel par pixel sans tramage : le tramage des dégradés CSS de Chromium
     ajoute un bruit qui fait dépasser 300 Ko au PNG. Sans JavaScript, le dégradé CSS reste affiché. */
  (() => {
    const W = 1200, H = 630, stops = [[0, [0x38, 0x60, 0x97]], [0.5, [0x2E, 0x7C, 0xB0]], [1, [0x5C, 0x4B, 0xB9]]];
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d"), d = x.createImageData(W, H), k = Math.SQRT1_2, len = (W + H) * k;
    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      const t = Math.min(1, Math.max(0, ((px + .5 - W / 2) * k + (py + .5 - H / 2) * k) / len + .5));
      const [a, b] = t < .5 ? [stops[0], stops[1]] : [stops[1], stops[2]], u = (t - a[0]) / (b[0] - a[0]), i = (py * W + px) * 4;
      for (let ch = 0; ch < 3; ch++) d.data[i + ch] = Math.round(a[1][ch] + (b[1][ch] - a[1][ch]) * u);
      d.data[i + 3] = 255;
    }
    x.putImageData(d, 0, 0);
    document.querySelector(".card").style.background = `url(${c.toDataURL("image/png")})`;
  })();
</script>
</body>
</html>
